# YouTube clips for plate testing. INTERNAL TESTING ONLY - see DATA_NOTICE.md.
#
# Per source: url, country, condition (day|night), start, end
# Timestamps: "HH:MM:SS", "MM:SS", or seconds (decimals allowed).
# Several segments from one video: use `segments:` instead of start/end.
defaults:
  download_mode: section     # section: fetch only the segment | full: fetch whole video (cached, reused)
  fallback_to_full: true     # if a section download fails, try the full video
  format: "bv*[height<=1080]+ba/b[height<=1080]/bv*+ba/b"
  attempts: 3
  cookies_from_browser: null # e.g. "chrome" if YouTube asks you to sign in
  rate_limit: null           # e.g. "5M"

# Real GCC driving videos (found by title/description search). The segment times are a starting
# point, NOT verified: each skips the first ~2 minutes of intro and takes 60 s. Preview each video and
# move the segment to a stretch with traffic and readable plates (behind cars, at lights, in queues).
# Day/night comes from the video title. A rear-facing camera (Dubai, below) shows front plates.
sources:
