# YouTube clips for plate testing. INTERNAL TESTING ONLY - see DATA_NOTICE.md.
#
# Per source: url, country, condition (day|night), start, end
# Timestamps: "HH:MM:SS", "MM:SS", or seconds (decimals allowed).
# Several segments from one video: use `segments:` instead of start/end.
defaults:
  download_mode: section     # section: fetch only the segment | full: fetch whole video (cached, reused)
  fallback_to_full: true     # if a section download fails, try the full video
  format: "bv*[height<=2160]+ba/b[height<=2160]/bv*+ba/b"   # keep in step with video.target_height
  attempts: 3
  cookies_from_browser: null # e.g. "chrome" if YouTube asks you to sign in
  rate_limit: null           # e.g. "5M"

# Real GCC driving videos. Segments were chosen from contact sheets (one frame every 15 s over the
# whole video) for close, slow traffic with plates facing the camera; the score (1-5) is how good
# the segment is for plate testing. The best ones were checked at full resolution, where plates
# are readable. Sources with nothing usable are kept but disabled (enabled: false), with the reason.
# A rear-facing camera (Dubai, below) shows front plates.
sources:
  # ---- Saudi Arabia ----------------------------------------------------------------------------
  - url: "https://www.youtube.com/watch?v=sS2UegfCB6o"
    country: ksa
    condition: day
    segments:
      - {start: "43:00", end: "44:00"}   # 5: stop-and-go, SUV/Land Cruiser/semi 1-2 lengths ahead (plates readable)
      - {start: "20:00", end: "21:00"}   # 5: bumper-to-bumper, 3 lanes of close rears, truck + pickup
      - {start: "32:00", end: "33:00"}   # 5: box truck, Jeep, sedans close
    notes: "4K Drive Riyadh (1h07). 18:00-34:00 is dense urban expressway traffic throughout"
  - url: "https://www.youtube.com/watch?v=wo2Q5bELiC0"
    country: ksa
    condition: day
    enabled: false
    start: "03:30"
    end: "04:30"                         # 2: sun straight into the lens, plates in silhouette
    notes: "Riyadh 4K Driving Tour - desert highway, low-sun glare. Only useful as a glare stress test"
  - url: "https://www.youtube.com/watch?v=PNDPhXbtnp8"
    country: ksa
    condition: night
    segments:
      - {start: "21:15", end: "22:15"}   # 4: dense queue on a lit arterial, cars 1-2 lengths ahead, taillight bloom
