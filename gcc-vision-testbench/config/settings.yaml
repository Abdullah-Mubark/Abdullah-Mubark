# Global settings. Paths are relative to the project root unless absolute.
# "{data_root}" is substituted; GCCVT_DATA_ROOT in .env overrides data_root.
paths:
  data_root: data
  raw: "{data_root}/raw"                    # downloads as received (archives, full videos)
  faces: "{data_root}/faces"                # faces/{dataset}/...
  plates: "{data_root}/plates"              # plates/{country}/{day|night}/clip_0001.mp4
  plates_images: "{data_root}/plates_images"  # Roboflow image datasets (YOLOv8)
  frames: "{data_root}/frames"              # frames/{clip_id}/000000.jpg + index.csv
  annotations: "{data_root}/annotations"    # draft labels from pre-annotation
  models: models                            # model weights (relative to project root)
  results: "{data_root}/results"            # results/{run_id}/: predictions, metrics, failures
  manifest: "{data_root}/manifest.csv"
  logs: logs

taxonomy:
  countries: [ksa, uae, qatar, kuwait, oman, bahrain]
  conditions: [day, night]
  # Accepted spellings in configs / folder names -> canonical country code
  country_aliases:
    sa: ksa
    saudi: ksa
    saudi_arabia: ksa
    ae: uae
    emirates: uae
    qa: qatar
    kw: kuwait
    om: oman
    bh: bahrain

clips:
  name_pattern: "clip_{n:04d}"

network:
  timeout_s: 60
  retries: 5            # attempts per request / download
  backoff_s: 2          # first retry delay, doubles each time
  backoff_max_s: 60
  chunk_mib: 4
  user_agent: "gcc-vision-testbench/0.1"

video:                  # output encoding for YouTube clips (and local "transcode" mode)
  target_height: 2160   # 4K: plates are ~2x wider in pixels than at 1080p
  allow_upscale: false  # if false, sources below target_height keep their resolution (logged)
  # HEVC CRF 28 at <=30 fps is ~4-5x smaller than H.264 CRF 18 with plates equally readable (checked on
  # day and night 4K clips, near and far plates). Not AV1: common OpenCV builds can't decode it.
  # To go back: codec libx264, crf 18, preset veryfast, max_fps null. Re-encode existing clips with
  # make recompress.
  codec: libx265
  crf: 28
  preset: fast           # x265 speed: ~2 min per 4K minute on 16 cores; medium is slower and no smaller
  max_fps: 30            # 60 fps sources are halved (eval samples at 2 fps); null keeps the source rate
  keep_audio: false

face_clips:             # make face-clips: overrides of video: above for low-res face sequences
  # ChokePoint faces are ~100 px wide in 800x600 frames. CRF 28 (fine for 4K plates) smears eyes and
  # mouths; CRF 20 looks like the old H.264 CRF 18 clips at ~1/3 of the size. Re-encode with
  # make face-clips ARGS="--force".
  crf: 20
