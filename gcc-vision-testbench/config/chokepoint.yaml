# ChokePoint face video dataset (Zenodo).
zenodo:
  api_url: "https://zenodo.org/api/records/{record_id}"
  record_id: 815657

files:
  # fnmatch patterns on Zenodo file names. Default: everything.
  # Portal 1, people entering (~1.6 GB, 12 camera sequences) + ground truth. The full dataset is
  # ~12 GB: use ["*"] for everything, or add e.g. "P2E*" for portal 2.
  include: ["P1E*", "groundtruth*"]
  exclude: []

extract: true                      # unpack archives into data/faces/chokepoint/
delete_archives_after_extract: false
fps: 30                            # ChokePoint frame rate (frames ship as JPEG sequences)
license: "Original ChokePoint licence - see the Zenodo record page"
